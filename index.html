<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sobre o Saibro · Tênis Clube</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#D94F26">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sobre o Saibro">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --verde-900:#1B5E20; --verde-700:#2E7D32; --verde-500:#43A047; --verde-100:#E8F5E9;
  --azul:#1E88E5; --azul-100:#E3F2FD; --vermelho:#E53935; --vermelho-100:#FFEBEE;
  --laranja:#FB8C00; --laranja-100:#FFF3E0; --cinza:#9E9E9E;
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#F9FAF9; --border:#E4E8E5;
  --text:#1C2520; --text-2:#5B6660; --text-3:#8B958F;
  --shadow:0 1px 3px rgba(20,40,25,.08),0 4px 14px rgba(20,40,25,.06);
  --radius:14px;
}
[data-tema="escuro"]{
  --bg:#101613; --surface:#1A211D; --surface-2:#151C18; --border:#2A332E;
  --text:#E8EDE9; --text-2:#A8B2AC; --text-3:#78827C;
  --verde-100:#1d3322; --azul-100:#12283a; --vermelho-100:#3a1917; --laranja-100:#38270f;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--verde-500);box-shadow:0 0 0 3px rgba(67,160,71,.15)}
a{color:var(--verde-700)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}

/* ===== LAYOUT ===== */
#app{display:flex;min-height:100vh}
#sidebar{width:230px;background:linear-gradient(180deg,var(--verde-900),#153f18);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .25s}
.logo{padding:calc(20px + env(safe-area-inset-top)) 18px 14px;display:flex;gap:10px;align-items:center}
.logo .em{font-size:28px}
.logo b{font-size:17px;display:block}
.logo small{opacity:.75;font-size:11px}
#nav{flex:1;overflow-y:auto;padding:6px 10px}
#nav a{display:flex;gap:10px;align-items:center;color:#fffc;text-decoration:none;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:2px}
#nav a:hover{background:#ffffff14}
#nav a.ativo{background:#ffffff22;color:#fff;font-weight:600}
.side-foot{padding:12px 16px;font-size:11px;color:#fff9;border-top:1px solid #ffffff1c}
.side-foot a{color:#fffc;text-decoration:none}
#overlayNav{display:none;position:fixed;inset:0;background:#0007;z-index:35}
#main{flex:1;margin-left:230px;display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
#btnHamb{display:none;background:none;border:none;font-size:22px;color:var(--text)}
#tituloPagina{font-size:20px;flex:1}
.top-busca{position:relative;width:260px}
.top-busca input{padding-left:34px}
.top-busca .lupa{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
#buscaRes{position:absolute;top:105%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:300px;overflow:auto;display:none;z-index:50}
#buscaRes .item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border)}
#buscaRes .item:hover{background:var(--surface-2)}
#conteudo{padding:22px;max-width:1300px;width:100%;margin:0 auto}

/* ===== COMPONENTES ===== */
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;display:inline-flex;gap:7px;align-items:center;justify-content:center}
.btn-p{background:var(--verde-700);color:#fff}
.btn-p:hover{background:var(--verde-900)}
.btn-sec{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-sec:hover{background:var(--surface-2)}
.btn-danger{background:var(--vermelho);color:#fff}
.btn-mini{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-icone{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;font-size:17px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.card h2{font-size:15.5px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.kpi .t{font-size:12px;color:var(--text-2);display:flex;gap:6px;align-items:center}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .s{font-size:11.5px;color:var(--text-3);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.ch-verde{background:var(--verde-100);color:var(--verde-700)}
.ch-azul{background:var(--azul-100);color:var(--azul)}
.ch-verm{background:var(--vermelho-100);color:var(--vermelho)}
.ch-lar{background:var(--laranja-100);color:var(--laranja)}
.ch-cinza{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3);padding:8px 10px;border-bottom:2px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--surface-2)}
.label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-2);margin:12px 0 5px}
.muted{color:var(--text-3);font-size:12.5px}
.linha-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vazio{padding:34px;text-align:center;color:var(--text-3);font-size:14px}

/* ===== MODAL / TOAST ===== */
#modalBg{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;z-index:60;padding:4vh 14px;overflow:auto}
#modal{background:var(--surface);border-radius:16px;box-shadow:0 10px 50px #0005;width:100%;max-width:560px;padding:22px;animation:pop .18s;position:relative}
.modal-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text-2);font-size:15px;font-weight:700;z-index:3;transition:all .2s}
.modal-x:hover{background:var(--border)}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
#modal h2{font-size:17px;margin-bottom:6px}
#toastArea{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);animation:pop .2s}
.toast.ok{background:var(--verde-700);color:#fff}
.toast.erro{background:var(--vermelho);color:#fff}

/* ===== AGENDA ===== */
.agenda-grade{display:grid;overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.ag-col-h{padding:10px;font-size:13px;font-weight:700;text-align:center;border-bottom:2px solid var(--border);background:var(--surface-2)}
.ag-hora{font-size:11px;color:var(--text-3);padding:6px 8px;border-top:1px solid var(--border);text-align:right}
.ag-cel{border-top:1px solid var(--border);border-left:1px solid var(--border);min-height:46px;position:relative;cursor:pointer}
.ag-cel:hover{background:var(--verde-100)}
.bloco{position:absolute;inset:2px;border-radius:8px;padding:4px 7px;font-size:11.5px;overflow:hidden;color:#fff;cursor:pointer;z-index:2}
.b-confirmada{background:var(--verde-500)}
.b-aguardando{background:var(--laranja)}
.b-aula{background:var(--azul)}
.b-bloqueio{background:var(--cinza)}
.b-evento{background:#8E24AA}
.b-cancelada{background:var(--vermelho);opacity:.55}

/* ===== QUADRA CARD ===== */
.foto-quadra{height:90px;border-radius:10px 10px 0 0;background-size:88px 62px;background-color:#B75C36}
.quadra-card{padding:0;overflow:hidden}
.quadra-card .corpo{padding:14px 16px}

/* ===== PORTAL (tema laranja · premium) ===== */
:root{--lar-p:#EE6136;--lar-forte:#D94F26;--lar-claro:#FF8A5C;--lar-suave:#FFF1EA;--ok:#2EAD62;--ok-suave:#E8F7EE}
.portal-area{margin:0;padding:0 0 32px;min-height:100vh;background:#F7F5F2;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-x:clip}
@media(max-width:960px){.portal-area{padding-bottom:96px}}
/* quando o portal está ativo, o contêiner do app fica sem limites de largura */
#conteudo.portal-cheio{max-width:none!important;padding:0!important;margin:0!important;width:100%}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;padding:calc(10px + env(safe-area-inset-top)) 24px 10px;position:sticky;top:0;z-index:25;box-shadow:0 1px 10px rgba(60,30,10,.07)}
.p-logo{display:flex;gap:12px;align-items:center;flex-shrink:0}
.p-logo .ic{width:44px;height:44px;background:linear-gradient(135deg,var(--lar-claro),var(--lar-forte));color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 3px 8px rgba(238,97,54,.3)}
.p-logo .ic.crest{background:#AC4B14;padding:0;overflow:hidden}
.p-logo .ic.crest img{width:100%;height:100%;object-fit:cover}
.p-logo b{font-size:17px;color:#2B2B2B;display:block;line-height:1.15}
.p-logo small{display:block;font-size:9px;color:var(--lar-p);font-weight:800;letter-spacing:2.2px}
.p-nav{display:flex;gap:4px;align-items:center;flex:1;justify-content:center}
.p-nav a{display:flex;gap:7px;align-items:center;color:#4A453F;text-decoration:none;font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:10px;transition:all .15s;cursor:pointer}
.p-nav a:hover{background:#F7F4F0;color:var(--lar-forte)}
.p-conta{display:flex;gap:14px;align-items:center;flex-shrink:0}
.sino{position:relative;font-size:19px;cursor:pointer;color:#6B655D;padding:10px;margin:-10px;border-radius:50%;transition:transform .2s}
.sino:hover{transform:scale(1.12)}
.sino.tem::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--lar-p);border:2px solid #fff}
.btn-lar{background:var(--lar-p);color:#fff;transition:all .18s}
.btn-lar:hover{background:var(--lar-forte);transform:translateY(-1px);box-shadow:0 4px 12px rgba(238,97,54,.3)}
.btn-lar-sec{background:#fff;border:1.5px solid var(--lar-p);color:var(--lar-p);transition:all .18s}
.btn-lar-sec:hover{background:var(--lar-suave)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--lar-suave);color:var(--lar-forte);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid var(--lar-p)}
.avatar-img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--lar-p)}
.conta-info b{display:block;font-size:13px;color:#2B2B2B;line-height:1.2}
.conta-info small{font-size:11px;color:#A39D94}
.perfil-tap{display:flex;gap:10px;align-items:center;cursor:pointer;padding:5px 8px 5px 5px;border-radius:12px;transition:background .2s}
.perfil-tap:hover{background:#F4F1EC}
/* tela de perfil */
.perfil-foto{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--lar-suave);display:flex;align-items:center;justify-content:center;margin:0 auto}
.perfil-inicial{background:linear-gradient(135deg,var(--lar-claro),var(--lar-forte));color:#fff;font-size:38px;font-weight:900}
.foto-editavel{display:inline-block;position:relative;cursor:pointer;line-height:0}
.foto-editavel .cam{position:absolute;bottom:2px;right:2px;width:30px;height:30px;border-radius:50%;background:var(--lar-p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #fff;line-height:1}
/* hero: faixa laranja de ponta a ponta, conteúdo começa abaixo (sem sobrepor) */
.p-hero{background:#F26A32;color:#fff;padding:24px 24px 28px;position:relative}
.p-hero .h-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.p-hero h1{font-size:29px;font-weight:900;letter-spacing:.2px;animation:heroIn .22s ease-out both}
.p-hero .sub{margin-top:8px;font-size:13.5px;opacity:.94;font-weight:600;max-width:560px;line-height:1.45;animation:heroIn .22s ease-out .04s both}
@keyframes heroIn{from{opacity:0;transform:translateY(6px)}}
/* bloco de localização */
.hero-local{display:flex;align-items:center;gap:10px;margin-top:16px}
.hero-local .loc-ic{font-size:15px;opacity:.95}
.hero-local .loc-txt b{display:block;font-size:14px;font-weight:800;line-height:1.2}
.hero-local .loc-txt small{font-size:12px;opacity:.9;font-weight:600}
.hero-local .loc-btn{margin-left:auto;font-size:12.5px;font-weight:800;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);padding:8px 14px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:all .2s}
.hero-local .loc-btn:hover{background:rgba(255,255,255,.28)}
/* clima glassmorphism */
.clima{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:12px 18px;flex-shrink:0;box-shadow:0 6px 18px rgba(0,0,0,.1);animation:heroIn .22s ease-out .08s both}
.clima .clima-ic{font-size:26px;line-height:1;animation:climaPulse 3s ease-in-out infinite}
@keyframes climaPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.clima .clima-txt b{font-size:18px;display:block;line-height:1.1;font-weight:800}
.clima .clima-txt small{font-size:11.5px;opacity:.92;display:block;font-weight:600}
.clima .clima-chuva{margin-left:auto;font-size:11.5px;opacity:.9;font-weight:600;text-align:right;max-width:130px;line-height:1.3}
/* layout com sidebar */
.p-miolo{max-width:1200px;margin:24px auto 0;padding:0 24px;position:relative}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px;align-items:start}
.layout>*{min-width:0}
.col-main{min-width:0}
.painel{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(60,30,10,.08);padding:20px;margin-bottom:8px}
.sec-t{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;color:#2B2B2B;margin:24px 4px 12px}
.sec-t small{font-weight:600;color:#A39D94;font-size:12px;margin-left:auto}
.aviso-janela{background:#FFF8E1;border:1px solid #F3E2AC;color:#8a6d00;border-radius:10px;padding:10px 14px;font-size:13px;margin-top:12px}
/* dias */
.dias-wrap{display:flex;align-items:center;gap:8px}
.seta{width:34px;height:34px;border-radius:50%;border:1px solid #ECE7E0;background:#fff;font-size:15px;color:#6B655D;flex-shrink:0;transition:all .15s}
.seta:hover{border-color:var(--lar-p);color:var(--lar-p)}
.dias{display:flex;gap:10px;overflow-x:auto;padding:10px 2px 8px;scroll-behavior:smooth;flex:1;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.dia-chip{scroll-snap-align:center}
.dia-chip{position:relative;min-width:92px;text-align:center;background:#F4F2EE;border:1.5px solid transparent;border-radius:14px;padding:13px 8px;cursor:pointer;font-size:11.5px;color:#8A857E;font-weight:800;transition:all .2s cubic-bezier(.2,.8,.3,1.1);flex-shrink:0}
.dia-chip b{display:block;font-size:18px;color:#2B2B2B;margin:2px 0;font-weight:900}
.dia-chip small{display:block;font-size:10px;color:#A39D94;font-weight:700}
.dia-chip:hover{border-color:var(--lar-claro);background:#fff;transform:translateY(-2px);box-shadow:0 6px 14px rgba(60,30,10,.1)}
.dia-chip.ativo{border-color:var(--lar-p);background:#fff;box-shadow:0 6px 16px rgba(238,97,54,.2);transform:translateY(-2px)}
.dia-chip.ativo,.dia-chip.ativo small{color:var(--lar-forte)}
.dia-chip.ativo b{color:var(--lar-forte)}
.dia-chip .selo-hoje{display:inline-block;background:var(--lar-p);color:#fff;font-size:8.5px;font-weight:800;letter-spacing:1px;padding:2px 9px;border-radius:999px;margin-top:4px}
.dia-chip .olho{font-size:9px;display:block;color:#B5B0A9;font-weight:700;margin-top:3px}
.legenda{display:flex;gap:16px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #F1ECE5;font-size:12px;color:#8A857E;flex-wrap:wrap}
.legenda .lg{display:flex;align-items:center;gap:6px;font-weight:600}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.d-livre{background:#fff;border:2.5px solid var(--ok)}
.d-pend{background:#FFD54F}
.d-ocup{background:#EF9A91}
/* card da quadra (foto grande à esquerda) */
.pq-card{background:#fff;border-radius:18px;box-shadow:0 4px 22px rgba(60,30,10,.08);margin-bottom:16px;transition:all .22s cubic-bezier(.22,.8,.3,1);animation:fadeUp .3s both;display:flex;overflow:hidden}
.pq-card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(60,30,10,.16)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
.pq-media{width:310px;min-height:240px;flex-shrink:0;background-size:cover;background-position:center;position:relative;overflow:hidden}
.foto-int{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .25s cubic-bezier(.22,.8,.3,1)}
.pq-card:hover .foto-int{transform:scale(1.03)}
.como-chegar{display:inline-flex;gap:6px;align-items:center;margin-top:7px;font-size:12px;font-weight:800;color:var(--lar-forte);cursor:pointer;padding:5px 12px;border:1.5px solid var(--lar-suave);background:var(--lar-suave);border-radius:999px;transition:all .2s cubic-bezier(.22,.8,.3,1);text-decoration:none}
.como-chegar:hover{background:#fff;border-color:var(--lar-p);transform:translateY(-1px)}
.fav{position:absolute;top:12px;left:12px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(20,20,20,.45);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);transition:all .18s}
.fav:hover{transform:scale(1.1)}
.fav.on{color:#FF5A6E;background:rgba(255,255,255,.92)}
.pq-body{flex:1;padding:24px;min-width:0;position:relative}
.pq-head{position:relative;padding-right:100px}
.pq-nome{font-size:20px;font-weight:800;color:#2B2B2B}
.pq-sport{color:var(--lar-p);font-weight:800;font-size:12.5px;margin:3px 0 4px}
.pq-end{color:#8A857E;font-size:12px}
.pq-aval{position:absolute;top:0;right:0;text-align:right;font-size:14px;font-weight:800;color:#2B2B2B}
.pq-aval .estrela{color:#F5A623}
.pq-aval small{display:block;font-weight:600;color:#A39D94;font-size:11px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.slotc.sel{border-color:var(--ok);background:var(--ok);color:#fff;box-shadow:0 6px 18px rgba(46,173,98,.35);animation:popSel .2s}

.slotc.sel .chk{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ok);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}

.slotc.pend .st{color:#C29A18}

.benef:first-child{border-left:none}
.benef:hover{transform:translateY(-2px);background:#FDFBF8}
.benef .ic{width:48px;height:48px;border-radius:14px;background:var(--lar-suave);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;transition:transform .2s}

/* footer elegante */

.p-foot .f-end{margin-top:10px;font-size:12px}
.p-foot .f-copy{margin-top:14px;font-size:11px;color:#C9C3BB}
.p-foot .f-adm{display:inline-block;margin-top:12px;padding:6px 14px;border:1px solid #E6E1DA;border-radius:999px;text-decoration:none;color:#B5B0A9;font-size:11px;transition:all .2s}
.p-foot .f-adm:hover{color:#6B655D;border-color:#C9C3BB}
/* modal do mapa */
.m-mapa iframe{width:100%;height:320px;border:0;border-radius:12px;margin-top:12px;background:#F1ECE5}
/* animação de confirmação */
.check-ok{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:14px auto 10px;box-shadow:0 8px 22px rgba(46,173,98,.4);animation:checkPop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes checkPop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
#barraSel{display:none!important}
@media(max-width:960px){

  .resumo{display:block;position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);z-index:44;padding:10px 22px calc(22px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;transform:translateY(calc(100% - 62px));transition:transform .25s cubic-bezier(.22,.8,.3,1)}
  .resumo.aberto{transform:translateY(0)}
  .sheet-head{display:flex}

}
@media(max-width:640px){
  /* header compacto: só logo, sino e perfil */
  .p-top{padding:calc(8px + env(safe-area-inset-top)) 16px 8px}

  .p-conta .btn-lar-sec{display:none}

  /* bloco 2: localização entre divisores */

  /* bloco 3: clima full-width */
  .clima{width:100%;margin-top:16px;padding:14px 16px}

  /* menos espaço até o calendário — conectado ao hero */
  .p-miolo{margin-top:10px;padding:0 14px}

  .legenda>span:last-child{font-size:9.5px;opacity:.8;text-overflow:ellipsis;overflow:hidden}
  /* quadras: anúncio premium — foto grande, ordem: nome→aval→esporte→badges→como chegar */
  .pq-card{flex-direction:column;border-radius:20px;box-shadow:0 3px 14px rgba(60,30,10,.07)}
  .pq-media{width:100%;min-height:205px}
  .pq-body{padding:18px}
  .pq-head{padding-right:0;display:flex;flex-direction:column;align-items:flex-start}

  /* horários: grade de botões grandes (sem scroll horizontal) */
  .slot-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));overflow:visible;gap:9px}
  .slotc{min-width:0;padding:14px 6px;font-size:14.5px;min-height:52px}
  .fav{width:44px;height:44px;font-size:19px}

  /* mapa em tela cheia */
  #modal.m-mapa{max-width:100vw;width:100vw;min-height:100vh;border-radius:0;margin:0}
  #modalBg.bg-mapa{padding:0}

}

/* ===== GRÁFICOS ===== */

<script>
/* ============================================================
   CONFIGURAÇÃO — cole aqui as chaves do seu projeto Supabase.
   Enquanto estiverem vazias, o app roda em MODO DEMO (dados
   salvos apenas neste navegador).
   ============================================================ */
const SUPABASE_URL = "https://zhwveeyjnkxwtxcoeqrp.supabase.co";      // ex.: https://abcdefgh.supabase.co
const SUPABASE_ANON_KEY = "sb_publishable_QjAlP3iWEPrmElkh7Mu7WQ_uw2G9q9j"; // chave "anon public" do projeto

/* ===== ESTADO GLOBAL ===== */
const ONLINE = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = ONLINE ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const DB = { quadras:[], clientes:[], reservas:[], bloqueios:[], waitlist:[], historico:[], config:{nome:"Sobre o Saibro", abre:6, fecha:21, tema:"claro", feriados:[], confirmacao_automatica:true, endereco:"R. Luiz Feliciano Cardoso, 497 - Praia do Siqueira, Cabo Frio - RJ, 28912-090"} };
const autoConfirma = () => DB.config.confirmacao_automatica!==false; // padrão: automático
let SESSAO = null;          // sessão admin
let CLIENTE_LOGADO = null;  // cliente do portal (objeto de agq_clientes)
// sessão do cliente é SALVA POR APARELHO (localStorage) — cada celular mantém a sua conta,
// independente dos outros. Não há sessão compartilhada no servidor.
function logarCliente(c){ CLIENTE_LOGADO=c; try{ if(c){ localStorage.setItem("agq_cliente",JSON.stringify(c)); localStorage.setItem("agq_cliente_id",c.id); } else { localStorage.removeItem("agq_cliente"); localStorage.removeItem("agq_cliente_id"); } }catch(e){} }
function sairCliente(){ logarCliente(null); SEL_SLOTS=[]; try{ guardarDono(null); }catch(e){} MODO_FECHAR=false; fecharModal(); renderPortalCliente(); }
function revincularCliente(){ // mantém o cliente logado após sincronizar dados
  try{
    if(SESSAO){ // admin: re-aponta para o objeto completo do banco
      const id=CLIENTE_LOGADO?CLIENTE_LOGADO.id:null;
      if(id){ const c=DB.clientes.find(x=>x.id===id); if(c&&c.telefone!==undefined) CLIENTE_LOGADO=c; }
      return;
    }
    // portal: os dados completos do próprio cliente ficam só neste aparelho (localStorage)
    if(!CLIENTE_LOGADO){ const s=localStorage.getItem("agq_cliente"); if(s) CLIENTE_LOGADO=JSON.parse(s); }
  }catch(e){}
}
let SEL_SLOTS = [];         // slots selecionados no portal
const dISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; // data LOCAL do usuário (nunca UTC — corrige o bug das 21h+)
const HOJE = () => dISO(new Date());
const AGORA_HM = () => { const n=new Date(); return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"); };
// reserva ainda vigente (não terminou): data futura, ou hoje com fim ainda por vir
const reservaVigente = r => r.data>HOJE() || (r.data===HOJE() && String(r.fim).slice(0,5) > AGORA_HM());
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtBRL = v => (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmtData = d => { const [a,m,dd]=String(d).split("-"); return `${dd}/${m}/${a}`; };
const fmtDataLonga = d => { const s=new Date(d+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); return s.charAt(0).toUpperCase()+s.slice(1); };
const hh = t => String(t).slice(0,5);

async function carregar(){
  if(!ONLINE){ carregarLocal(); revincularCliente(); return; }
  if(SESSAO){
    // ADMIN autenticado: acesso total às tabelas
    const nomes = {quadras:"agq_quadras",clientes:"agq_clientes",reservas:"agq_reservas",bloqueios:"agq_bloqueios",waitlist:"agq_waitlist",historico:"agq_historico"};
    for(const t of TABELAS){
      const {data,error} = await sb.from(nomes[t]).select("*").order(t==="historico"?"quando":"criado_em",{ascending:t!=="historico"});
      if(error){ console.error(t,error); toast("Erro ao carregar "+t,"erro"); }
      DB[t] = (data||[]).map(x=>({...x, inicio:x.inicio?hh(x.inicio):x.inicio, fim:x.fim?hh(x.fim):x.fim}));
    }
    const {data:cfg} = await sb.from("agq_config").select("*").eq("id",1).single();
    if(cfg?.dados) DB.config = {...DB.config, ...cfg.dados};
    revincularCliente();
    return;
  }
  // PORTAL público: lê só o que NÃO é pessoal (quadras, horários, reservas).
  // A lista de clientes NÃO é acessível — o parceiro vem de uma função segura (só nomes).
  for(const t of ["quadras","reservas","bloqueios"]){
    const {data,error} = await sb.from("agq_"+t).select("*").order("criado_em",{ascending:true});
    if(error){ console.error(t,error); }
    DB[t] = (data||[]).map(x=>({...x, inicio:x.inicio?hh(x.inicio):x.inicio, fim:x.fim?hh(x.fim):x.fim}));
  }
  const {data:cfg} = await sb.from("agq_config").select("*").eq("id",1).single();
  if(cfg?.dados) DB.config = {...DB.config, ...cfg.dados};
  try{ const {data:mens} = await sb.rpc("listar_mensalistas"); DB.clientes = mens||[]; }catch(e){ DB.clientes=[]; }
  DB.historico=[]; DB.waitlist=[];
  revincularCliente();
}

async function up(tabela, obj){
  if(!ONLINE){
    const arr = DB[tabela]; const i = arr.findIndex(x=>x.id===obj.id);
    if(i>=0) arr[i]={...arr[i],...obj}; else arr.push({...obj,id:obj.id||uid(),criado_em:new Date().toISOString()});
    salvarLocal(); return {ok:true};
  }
  const existe = obj.id && DB[tabela].some(x=>x.id===obj.id);
  const {error} = existe
    ? await sb.from("agq_"+tabela).update(obj).eq("id",obj.id)   // registro existente: atualiza só os campos enviados
    : await sb.from("agq_"+tabela).upsert(obj);                  // registro novo: insere completo
  if(error){ toast(error.message,"erro"); return {ok:false}; }
  await carregar(); return {ok:true};
}
async function del(tabela, id){
  if(!ONLINE){ DB[tabela]=DB[tabela].filter(x=>x.id!==id); salvarLocal(); return; }
  const {error} = await sb.from("agq_"+tabela).delete().eq("id",id);
  if(error) toast(error.message,"erro"); else await carregar();
}
async function salvarConfig(){
  if(!ONLINE){ salvarLocal(); return; }
  await sb.from("agq_config").upsert({id:1,dados:DB.config});
}
async function registrarHist(acao, detalhe){
  const h = {id:uid(),quando:new Date().toISOString(),quem:SESSAO?.user?.email||CLIENTE_LOGADO?.nome||"portal",acao,detalhe};
  if(!ONLINE){ DB.historico.unshift(h); salvarLocal(); return; }
  if(!SESSAO) return; // portal não escreve histórico direto — as funções seguras já registram
  await sb.from("agq_historico").insert({quem:h.quem,acao,detalhe});
}
function ligarRealtime(){
  if(!ONLINE) return;
  sb.channel("agq")
    .on("postgres_changes",{event:"*",schema:"public"},async ()=>{ await carregar(); rerender(); })
    .subscribe(st=>{ document.getElementById("estadoConexao").textContent = st==="SUBSCRIBED"?"online · tempo real":"conectando…"; });
}

/* ===== HELPERS DE NEGÓCIO ===== */
// bloqueio vale para a data? (data única, toda semana no mesmo dia, ou permanente)
const bloqueiaDia = (b,data) => b.permanente || b.data===data || (b.dia_semana!=null && b.dia_semana===new Date(data+"T12:00").getDay());
// Fim de semana (sábado e domingo): clube funciona só das 08h às 13h,
// e sem pausa de almoço (o clube já fecha às 13h).
const FDS_ABRE = 8, FDS_FECHA = 13;
function ehFimDeSemana(data){ if(!data) return false; const d=new Date(data+"T12:00").getDay(); return d===0||d===6; }
// pausa do clube (almoço): 12:00 às 13:00 — só de segunda a sexta
const ehPausa = (h,data) => { if(ehFimDeSemana(data)) return false; const H=+String(h).slice(0,2); return H>=(DB.config.pausa_ini??12) && H<(DB.config.pausa_fim??13); };
function faixaDoDia(data){
  if(ehFimDeSemana(data)) return {abre:FDS_ABRE, fecha:FDS_FECHA};
  return {abre:DB.config.abre, fecha:DB.config.fecha};
}
function horaForaDoExpediente(data,h){ const {abre,fecha}=faixaDoDia(data); const H=+String(h).slice(0,2); return H<abre||H>=fecha; }
const Svc = {
  quadra: id => DB.quadras.find(q=>q.id===id)||{nome:"?"},
  cliente: id => DB.clientes.find(c=>c.id===id)||{nome:"—"},
  reservasDia: (data,qid) => DB.reservas.filter(r=>r.data===data && (!qid||r.quadra_id===qid) && r.status!=="cancelada"),
  ocupado: (qid,data,ini) => DB.reservas.some(r=>r.quadra_id===qid&&r.data===data&&r.status!=="cancelada"&&r.inicio<=ini&&r.fim>ini)
           || DB.bloqueios.some(b=>b.quadra_id===qid&&bloqueiaDia(b,data)&&(!b.inicio||(b.inicio<=ini&&b.fim>ini))),
  horas(data){ const {abre,fecha}=faixaDoDia(data); const out=[]; for(let h=abre;h<fecha;h++) out.push(String(h).padStart(2,"0")+":00"); return out; },
  receitaMes(ano,mes){ return DB.reservas.filter(r=>r.pagamento&&r.data?.startsWith(`${ano}-${String(mes).padStart(2,"0")}`)).reduce((s,r)=>s+(+r.valor||0)-(+r.desconto||0),0); }
};

async function fazerLogin(){

  if(!ONLINE){ SESSAO={user:{email:email||"demo@local"}}; toast("Bem-vindo (modo demo)!"); rerender(); return; }

  SESSAO=data.session; await carregar(); toast("Bem-vindo!"); rerender();
}
function traduzErro(m){ return {"Invalid login credentials":"E-mail ou senha inválidos"}[m]||m; }

function avisosInteligentes(){
  const avisos=[]; const hoje=HOJE();
  const pendPag = DB.reservas.filter(r=>!r.pagamento&&r.status!=="cancelada"&&r.tipo!=="bloqueio"&&r.data<=hoje);
  if(pendPag.length) avisos.push(`💳 <b>${pendPag.length}</b> reserva(s) com pagamento pendente — total ${fmtBRL(pendPag.reduce((s,r)=>s+(+r.valor||0)-(+r.desconto||0),0))}`);
  const aguard = DB.reservas.filter(r=>r.status==="aguardando"&&r.data>=hoje);
  if(aguard.length) avisos.push(`⏳ <b>${aguard.length}</b> solicitação(ões) aguardando aprovação`);
  const manut = DB.quadras.filter(q=>q.status==="manutencao");
  if(manut.length) avisos.push(`🔧 Quadra(s) em manutenção: ${manut.map(q=>esc(q.nome)).join(", ")}`);
  if(DB.waitlist.length) avisos.push(`⏳ <b>${DB.waitlist.length}</b> pessoa(s) na lista de espera`);
  const fer = (DB.config.feriados||[]).find(f=>f.data===hoje);
  if(fer) avisos.push(`🎉 Hoje: <b>${esc(fer.nome)}</b>`);
  return avisos.length?avisos:["✅ Tudo em dia por aqui!"];
}
function pgDashboard(){
  const hoje=HOJE(), agora=new Date();
  const resHoje = Svc.reservasDia(hoje).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  const receitaHoje = resHoje.filter(r=>r.pagamento).reduce((s,r)=>s+(+r.valor||0)-(+r.desconto||0),0);
  const horaAgora = String(agora.getHours()).padStart(2,"0")+":"+String(agora.getMinutes()).padStart(2,"0");
  const emQuadra = resHoje.filter(r=>r.inicio<=horaAgora&&r.fim>horaAgora);
  const proximos = resHoje.filter(r=>r.inicio>horaAgora&&r.inicio<=String(agora.getHours()+1).padStart(2,"0")+":"+String(agora.getMinutes()).padStart(2,"0"));
  const totalSlots = DB.quadras.length*Svc.horas(hoje).length;
  const ocupPct = totalSlots?Math.round(resHoje.length/totalSlots*100):0;

  document.getElementById("conteudo").innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="t">📅 Reservas hoje</div><div class="v">${resHoje.length}</div><div class="s">${fmtDataLonga(hoje)}</div></div>
    <div class="kpi"><div class="t">💰 Receita de hoje</div><div class="v">${fmtBRL(receitaHoje)}</div><div class="s">pagamentos confirmados</div></div>
    <div class="kpi"><div class="t">📊 Ocupação em tempo real</div><div class="v">${ocupPct}%</div><div class="s">${resHoje.length} de ${totalSlots} horários</div></div>
    <div class="kpi"><div class="t">👥 Clientes</div><div class="v">${DB.clientes.length}</div><div class="s">cadastrados</div></div>
  </div>
  <div class="card"><h2>🔔 Avisos</h2>${avisosInteligentes().map(a=>`<div style="padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px">${a}</div>`).join("")}</div>
  <div class="grid g2">
    <div class="card"><h2>▶️ Agora & próximos 30 min</h2>
      ${emQuadra.length||proximos.length ? [...emQuadra.map(r=>lin(r,"🟢 em quadra")),...proximos.map(r=>lin(r,"🕐 chegando"))].join("") : '<div class="vazio">Nenhuma atividade neste momento</div>'}
    </div>
    <div class="card"><h2>🗺️ Mapa das quadras</h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
      ${DB.quadras.map(q=>{
        const oc = resHoje.find(r=>r.quadra_id===q.id&&r.inicio<=horaAgora&&r.fim>horaAgora);
        const cor = q.status==="manutencao"?"var(--laranja)":q.status==="bloqueada"?"var(--vermelho)":q.status==="aulas"?"var(--azul)":oc?"var(--azul)":"var(--verde-500)";
        const tx  = q.status==="manutencao"?"Manutenção":q.status==="bloqueada"?"Bloqueada":q.status==="aulas"?"🎓 Aulas":oc?esc(Svc.cliente(oc.cliente_id).nome):"Livre";
        return `<div style="border:2px solid ${cor};border-radius:12px;padding:12px;text-align:center;cursor:pointer" onclick="location.hash='#/agenda'">
          <div style="font-size:20px">${q.emoji||"🎾"}</div><b style="font-size:13px">${esc(q.nome)}</b>
          <div class="muted" style="margin-top:3px">${tx}</div></div>`;
      }).join("")}
      </div>
    </div>
  </div>
  <div class="card"><h2>🗓️ Linha do tempo de hoje — ${fmtDataLonga(hoje)}</h2>${timelineHoje(resHoje)}</div>`;

  function lin(r,tag){ return `<div class="linha-flex" style="padding:8px 0;border-bottom:1px solid var(--border)">
    <span class="chip ch-verde">${tag}</span><b style="font-size:13.5px">${hh(r.inicio)}–${hh(r.fim)}</b>
    <span style="font-size:13.5px">${esc(Svc.cliente(r.cliente_id).nome)}</span>
    <span class="muted">${esc(Svc.quadra(r.quadra_id).nome)}</span>
    <button class="btn btn-sec btn-mini" onclick="abrirDetalheReserva('${r.id}')">abrir</button></div>`; }
}
function timelineHoje(res){
  if(!res.length) return '<div class="vazio">Nenhuma reserva para hoje</div>';
  const dataTl=res[0]?.data||HOJE(), faixaTl=faixaDoDia(dataTl);
  const horas=Svc.horas(dataTl), abre=faixaTl.abre, span=faixaTl.fecha-abre;
  return `<div style="position:relative;height:${DB.quadras.length*44+26}px;overflow-x:auto">
    <div style="display:flex;margin-left:110px">${horas.map(h=>`<div style="flex:1;font-size:10.5px;color:var(--text-3);min-width:34px">${h}</div>`).join("")}</div>
    ${DB.quadras.map((q,i)=>`
      <div style="position:absolute;top:${26+i*44}px;left:0;width:104px;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${q.emoji||"🎾"} ${esc(q.nome)}</div>
      <div style="position:absolute;top:${26+i*44}px;left:110px;right:0;height:38px;background:var(--surface-2);border-radius:8px">
      ${res.filter(r=>r.quadra_id===q.id).map(r=>{
        const ih=+r.inicio.slice(0,2)+(+r.inicio.slice(3,5))/60, fh=+r.fim.slice(0,2)+(+r.fim.slice(3,5))/60;
        const l=(ih-abre)/span*100, w=(fh-ih)/span*100;
        const cls=r.tipo==="aula"?"b-aula":r.tipo==="bloqueio"?"b-bloqueio":r.tipo==="evento"?"b-evento":r.status==="aguardando"?"b-aguardando":"b-confirmada";
        return `<div class="bloco ${cls}" style="left:${l}%;width:${w}%;top:2px;bottom:2px;inset-block:2px" onclick="abrirDetalheReserva('${r.id}')">${hh(r.inicio)} ${esc(Svc.cliente(r.cliente_id).nome)}</div>`;
      }).join("")}
      </div>`).join("")}
  </div>`;
}

function resFiltradas(data){
  return DB.reservas.filter(r=>r.data===data
    &&(!AG.quadra||r.quadra_id===AG.quadra)
    &&(!AG.tipo||r.tipo===AG.tipo)
    &&(AG.situacao?r.status===AG.situacao:r.status!=="cancelada"));
}
function renderGradeDia(){
  const quadras = AG.quadra?DB.quadras.filter(q=>q.id===AG.quadra):DB.quadras;
  const horas = Svc.horas(AG.data);
  const res = resFiltradas(AG.data);
  document.getElementById("agendaCorpo").innerHTML = `
  <div class="agenda-grade" style="grid-template-columns:70px repeat(${quadras.length},minmax(130px,1fr))">
    <div class="ag-col-h"></div>
    ${quadras.map(q=>`<div class="ag-col-h">${q.emoji||"🎾"} ${esc(q.nome)}</div>`).join("")}
    ${horas.map(h=>`
      <div class="ag-hora">${h}</div>
      ${quadras.map(q=>{
        if(ehPausa(h,AG.data)) return `<div class="ag-cel" style="background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 6px,var(--border) 6px,var(--border) 8px);cursor:not-allowed" title="Pausa 12:00–13:00"></div>`;
        const r = res.find(x=>x.quadra_id===q.id&&x.inicio<=h&&x.fim>h);
        if(r){
          const primeira = r.inicio===h;
          const cls=r.tipo==="aula"?"b-aula":r.tipo==="bloqueio"?"b-bloqueio":r.tipo==="evento"?"b-evento":r.status==="aguardando"?"b-aguardando":"b-confirmada";
          return `<div class="ag-cel"><div class="bloco ${cls}" onclick="abrirDetalheReserva('${r.id}')">${primeira?`<b>${hh(r.inicio)}–${hh(r.fim)}</b><br>${esc(Svc.cliente(r.cliente_id).nome)}`:""}</div></div>`;
        }
        const bloq = DB.bloqueios.find(b=>b.quadra_id===q.id&&bloqueiaDia(b,AG.data)&&(!b.inicio||(b.inicio<=h&&b.fim>h)));
        if(bloq) return `<div class="ag-cel" style="background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 6px,var(--border) 6px,var(--border) 8px);cursor:not-allowed" title="${esc(bloq.motivo||"Bloqueado")}"></div>`;
        return `<div class="ag-cel" onclick="modalReserva(null,{quadra_id:'${q.id}',data:'${AG.data}',inicio:'${h}'})" title="Clique para reservar"></div>`;
      }).join("")}`).join("")}
  </div>`;
}
function renderGradeSemana(){
  const base=new Date(AG.data+"T12:00"); base.setDate(base.getDate()-base.getDay());

function renderLista(){

  else calcularValor();

function calcularValor(){
  const q = Svc.quadra(document.getElementById("fQuadra").value);
  const dur = +document.getElementById("fDur").value/60;
  document.getElementById("fValor").value = ((+q.preco||0)*dur).toFixed(2);
}
async function salvarReserva(id){
  const g = x=>document.getElementById(x).value;
  const ini=g("fInicio"), dur=+g("fDur");
  const fimMin = +ini.slice(0,2)*60+ +ini.slice(3,5)+dur;
  const fim = String(Math.floor(fimMin/60)).padStart(2,"0")+":"+String(fimMin%60).padStart(2,"0");
  const base = {quadra_id:g("fQuadra"),cliente_id:g("fCliente"),data:g("fData"),inicio:ini,fim,
    tipo:g("fTipo"),professor:g("fProf"),valor:+g("fValor")||0,desconto:+g("fDesc")||0,
    pagamento:document.getElementById("fPago").checked,forma:g("fForma"),status:g("fStatus"),obs:g("fObs")};
  if(base.cliente_id==="__novo"){ toast("Escolha um cliente","erro"); return; }
  // conflito
  const conflito = DB.reservas.find(r=>r.id!==id&&r.quadra_id===base.quadra_id&&r.data===base.data&&r.status!=="cancelada"&&r.inicio<base.fim&&r.fim>base.inicio);
  if(conflito){ toast(`Conflito: ${hh(conflito.inicio)}–${hh(conflito.fim)} já reservado`,"erro"); return; }
  const rec = id?0:+g("fRec");
  if(id){ await up("reservas",{id,...base}); registrarHist("editou reserva",`${base.data} ${ini}`); }
  else{
    const grupo = rec?uid():null;
    for(let i=0;i<=(rec?rec-1:0);i++){
      const d=new Date(base.data+"T12:00"); d.setDate(d.getDate()+i*7);
      await up("reservas",{id:uid(),...base,data:dISO(d),recorrente:grupo});
    }
    registrarHist("criou reserva",`${base.data} ${ini}${rec?` (recorrente ×${rec})`:""}`);
  }
  fecharModal(); toast("Reserva salva!"); rerender();
}
function abrirDetalheReserva(id){
  const r=DB.reservas.find(x=>x.id===id); if(!r) return;
  const c=Svc.cliente(r.cliente_id), q=Svc.quadra(r.quadra_id);
  abrirModal(`
  <h2>📋 Detalhes da reserva</h2>
  <div style="font-size:14px;line-height:1.9">
    <b>${esc(c.nome)}</b> ${c.telefone?`· <a href="https://wa.me/55${(c.telefone||"").replace(/\D/g,"")}" target="_blank">${esc(c.telefone)} 💬</a>`:""}<br>
    ${r.parceiro_nome?`🤝 Joga com: <b>${esc(r.parceiro_nome)}</b> <span class="chip ${r.parceiro_tipo==="mensalista"?"ch-azul":"ch-cinza"}">${r.parceiro_tipo==="mensalista"?"⭐ mensalista":"convidado"}</span><br>`:""}
    ${q.emoji||"🎾"} ${esc(q.nome)} — ${fmtData(r.data)}, ${hh(r.inicio)} às ${hh(r.fim)}<br>
    Tipo: ${esc(r.tipo)} ${r.professor?`· Professor: ${esc(r.professor)}`:""}<br>
    Valor: <b>${fmtBRL((+r.valor||0)-(+r.desconto||0))}</b> ${r.desconto>0?`<small>(desconto ${fmtBRL(+r.desconto)})</small>`:""}
    · ${r.pagamento?`<span class="chip ch-verde">Pago${r.forma?" · "+esc(r.forma):""}</span>`:'<span class="chip ch-lar">A pagar</span>'}<br>
    Situação: ${chipStatus(r.status)} ${r.checkin?`· Check-in ${new Date(r.checkin).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`:""}
    ${r.obs?`<br><small class="muted">Obs: ${esc(r.obs)}</small>`:""}
  </div>
  <div class="linha-flex" style="margin-top:16px">
    ${r.status==="aguardando"?`<button class="btn btn-p btn-mini" onclick="aprovarReserva('${r.id}')">✅ Aprovar</button>`:""}
    ${!r.checkin&&r.status==="confirmada"?`<button class="btn btn-sec btn-mini" onclick="fazerCheck('${r.id}')">📍 Check-in</button>`:""}
    ${!r.pagamento?`<button class="btn btn-sec btn-mini" onclick="marcarPago('${r.id}')">💰 Marcar pago</button>`:""}
    <button class="btn btn-sec btn-mini" onclick="fecharModal();modalReserva('${r.id}')">✏️ Editar</button>
    <button class="btn btn-sec btn-mini" onclick="duplicarReserva('${r.id}')">📄 Duplicar</button>
    ${r.status!=="cancelada"?`<button class="btn btn-danger btn-mini" onclick="cancelarReserva('${r.id}')">🚫 Cancelar</button>`:""}
  </div>`);
}
async function aprovarReserva(id){ await up("reservas",{id,status:"confirmada"}); registrarHist("aprovou reserva",id); fecharModal(); toast("Reserva aprovada!"); rerender(); }
async function fazerCheck(id){ await up("reservas",{id,checkin:new Date().toISOString()}); fecharModal(); toast("Check-in feito!"); rerender(); }
async function marcarPago(id){ await up("reservas",{id,pagamento:true}); registrarHist("recebeu pagamento",id); fecharModal(); toast("Pagamento registrado!"); rerender(); }
async function duplicarReserva(id){
  const r=DB.reservas.find(x=>x.id===id); if(!r) return;
  const d=new Date(r.data+"T12:00"); d.setDate(d.getDate()+7);
  const {id:_,criado_em:__,checkin:___,checkout:____,...resto}=r;
  await up("reservas",{...resto,id:uid(),data:dISO(d),pagamento:false,status:"confirmada"});
  fecharModal(); toast("Duplicada para a próxima semana!"); rerender();
}
async function cancelarReserva(id){
  if(!confirm("Cancelar esta reserva?")) return;
  await up("reservas",{id,status:"cancelada"}); registrarHist("cancelou reserva",id);
  fecharModal(); toast("Reserva cancelada"); rerender();
}

function barrasV(dados){ // [{leg,val}]
  const max=Math.max(...dados.map(d=>d.val),1);
  return `<div class="barras">${dados.map(d=>`
    <div class="barra"><div class="val">${d.val?fmtBRL(d.val).replace(",00",""):""}</div>
    <div class="bloco-b" style="height:${Math.max(d.val/max*115,3)}px"></div>
    <div class="leg">${d.leg}</div></div>`).join("")}</div>`;
}
function barrasH(dados, fmt=fmtBRL){ // [{nome,val}]
  const max=Math.max(...dados.map(d=>d.val),1);
  return dados.map(d=>`<div class="hbar"><div class="nome">${esc(d.nome)}</div>
    <div class="trilho"><div class="fill" style="width:${d.val/max*100}%"></div></div>
    <div class="v">${fmt(d.val)}</div></div>`).join("")||'<div class="vazio">Sem dados neste período</div>';
}
function pgFinanceiro(){
  const agora=new Date(), ano=agora.getFullYear(), mes=agora.getMonth()+1;
  const mesStr=`${ano}-${String(mes).padStart(2,"0")}`;
  const meses=[...Array(6)].map((_,i)=>{const d=new Date(ano,mes-1-5+i,1);return d;});
  const receita6 = meses.map(d=>({leg:d.toLocaleDateString("pt-BR",{month:"short"}),val:Svc.receitaMes(d.getFullYear(),d.getMonth()+1)}));
  const resMes = DB.reservas.filter(r=>r.data?.startsWith(mesStr)&&r.status!=="cancelada");
  const pagosMes = resMes.filter(r=>r.pagamento);
  const recMes = pagosMes.reduce((s,r)=>s+(+r.valor||0)-(+r.desconto||0),0);
  const pend = DB.reservas.filter(r=>!r.pagamento&&r.status!=="cancelada"&&r.tipo!=="bloqueio"&&r.tipo!=="manutencao");
  const pendTotal = pend.reduce((s,r)=>s+(+r.valor||0)-(+r.desconto||0),0);
  const porQuadra = DB.quadras.map(q=>({nome:q.nome,val:pagosMes.filter(r=>r.quadra_id===q.id).reduce((s,r)=>s+(+r.valor||0)-(+r.desconto||0),0)})).sort((a,b)=>b.val-a.val);
  const porCliente = Object.entries(pagosMes.reduce((m,r)=>{const n=Svc.cliente(r.cliente_id).nome;m[n]=(m[n]||0)+(+r.valor||0)-(+r.desconto||0);return m;},{})).map(([nome,val])=>({nome,val})).sort((a,b)=>b.val-a.val).slice(0,6);
  const porProf = Object.entries(pagosMes.filter(r=>r.professor).reduce((m,r)=>{m[r.professor]=(m[r.professor]||0)+(+r.valor||0)-(+r.desconto||0);return m;},{})).map(([nome,val])=>({nome,val})).sort((a,b)=>b.val-a.val);
  const formas = ["Pix","Dinheiro","Cartão"].map(f=>({nome:f,val:pagosMes.filter(r=>r.forma===f).reduce((s,r)=>s+(+r.valor||0)-(+r.desconto||0),0)}));
  document.getElementById("conteudo").innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="t">💰 Receita do mês</div><div class="v">${fmtBRL(recMes)}</div><div class="s">${pagosMes.length} pagamentos</div></div>
    <div class="kpi"><div class="t">💳 A receber</div><div class="v">${fmtBRL(pendTotal)}</div><div class="s">${pend.length} pendências</div></div>
    <div class="kpi"><div class="t">🎾 Reservas no mês</div><div class="v">${resMes.length}</div></div>
    <div class="kpi"><div class="t">🧾 Ticket médio</div><div class="v">${fmtBRL(pagosMes.length?recMes/pagosMes.length:0)}</div></div>
  </div>
  <div class="card"><h2>📈 Receita — últimos 6 meses</h2>${barrasV(receita6)}</div>
  <div class="grid g2">
    <div class="card"><h2>🎾 Receita por quadra — mês atual</h2>${barrasH(porQuadra)}</div>
    <div class="card"><h2>⭐ Top clientes — mês atual</h2>${barrasH(porCliente)}</div>
    <div class="card"><h2>👨‍🏫 Receita por professor — mês atual</h2>${barrasH(porProf)}</div>
    <div class="card"><h2>💵 Por forma de pagamento — mês atual</h2>${barrasH(formas)}</div>
  </div>
  <div class="card"><h2>💳 Pagamentos pendentes (${pend.length})</h2>
    ${pend.length?`<div style="overflow-x:auto"><table>
      <tr><th>Data</th><th>Cliente</th><th>Quadra</th><th>Valor</th><th></th></tr>
      ${pend.sort((a,b)=>a.data.localeCompare(b.data)).map(r=>`<tr>
        <td>${fmtData(r.data)}</td><td><b>${esc(Svc.cliente(r.cliente_id).nome)}</b></td>
        <td>${esc(Svc.quadra(r.quadra_id).nome)}</td><td>${fmtBRL((+r.valor||0)-(+r.desconto||0))}</td>
        <td><button class="btn btn-p btn-mini" onclick="marcarPago('${r.id}')">💰 Receber</button></td></tr>`).join("")}
    </table></div>`:'<div class="vazio">Nenhuma pendência 🎉</div>'}
  </div>`;
}

async function importarBackup(inp){
  const f=inp.files[0]; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!confirm("Importar backup? Os dados atuais serão substituídos.")) return;
    for(const t of ["quadras","clientes","reservas","bloqueios","waitlist"]){
      if(!Array.isArray(d[t])) continue;
      if(ONLINE){ for(const item of d[t]) await sb.from("agq_"+t).upsert(item); }
      else DB[t]=d[t];
    }
    if(d.config) DB.config={...DB.config,...d.config};
    if(!ONLINE) salvarLocal(); else { await salvarConfig(); await carregar(); }
    toast("Backup importado!"); rerender();
  }catch(e){ toast("Arquivo inválido","erro"); }
}

function localResumo(){
  const e=(DB.config.endereco||"").trim();

  let bairro="", cidade="", uf="";
  if(p.length>=2){ const a=p[1].split(",").map(s=>s.trim()); bairro=a[0]||""; cidade=a[1]||""; }
  if(p.length>=3){ uf=(p[2].split(",")[0]||"").trim(); }

function fotoFundo(q){ // fundo SVG de reserva (a foto real entra como <img loading="lazy">)
  const svg = fotoQuadra(q).match(/url\((&quot;.*?&quot;)\)/)[1];
  return `background-image:url(${svg})`;
}
function modalComoChegar(){
  const end = DB.config.endereco||"";
  const q = encodeURIComponent(end);
  abrirModal(`
  <h2>📍 Como chegar</h2>
  <div style="font-size:14px;font-weight:800;color:#2B2B2B;margin-top:4px">${esc(DB.config.nome)}</div>
  <div class="muted" style="font-size:12.5px">${esc(end)}</div>
  <iframe loading="lazy" src="https://www.google.com/maps?q=${q}&output=embed" allowfullscreen></iframe>
  <div class="linha-flex" style="margin-top:14px;justify-content:space-between">
    <button class="btn btn-sec" onclick="fecharModal()">Fechar</button>
    <a class="btn btn-lar" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${q}">Abrir no Google Maps →</a>
  </div>`);
  document.getElementById("modal").classList.add("m-mapa");
  document.getElementById("modalBg").classList.add("bg-mapa");
}

function navPortal(sec){

function dataLimiteReserva(){ const d=new Date(); d.setDate(d.getDate()+JANELA_DIAS); return dISO(d); }
function dentroDaJanela(data){ return data>=HOJE() && data<=dataLimiteReserva(); }
// Regra geral: reservar um dia futuro (diferente de hoje) só libera a partir das
// HORA_LIBERA_DIA_SEGUINTE do dia anterior. Vale para todo mundo, sem exceção.
const HORA_LIBERA_DIA_SEGUINTE = 16;
function diaAnterior(data){ const d=new Date(data+"T12:00"); d.setDate(d.getDate()-1); return dISO(d); }
function horarioLiberacao(data){ const d=new Date(data+"T"+String(HORA_LIBERA_DIA_SEGUINTE).padStart(2,"0")+":00:00"); d.setDate(d.getDate()-1); return d; }
function gateDiaSeguinte(data){
  if(data<=HOJE()) return false;
  return new Date()<horarioLiberacao(data);
}
function podeReservarDia(data){ return dentroDaJanela(data) && !gateDiaSeguinte(data); }

/* ============================================================
   MODO DONO — o responsável pela quadra fecha/abre horários
   direto no portal, sem passar pelo painel administrativo.
   A permissão é a sessão de admin do Supabase (mesmo login do
   painel). Fica salva no aparelho, então ele entra só uma vez.
   ============================================================ */
const MOTIVO_DONO = "Reservado pela administração";
let MODO_FECHAR = false;
let DONO = null; // {id, token} do responsável pela quadra, neste aparelho
try{ const s=localStorage.getItem("agq_dono"); if(s) DONO=JSON.parse(s); }catch(e){}
function guardarDono(d){ DONO=d; try{ d?localStorage.setItem("agq_dono",JSON.stringify(d)):localStorage.removeItem("agq_dono"); }catch(e){} }
// É dono se entrou como mensalista responsável OU está autenticado como admin
function modoDonoAtivo(){ return !!DONO || !!SESSAO; }
// Checa, no login do mensalista, se aquele telefone é o do responsável
async function checarDono(tel,senha){
  if(!ONLINE) return;
  try{
    const {data} = await sb.rpc("dono_entrar",{p_tel:tel,p_senha:senha});
    if(data && data.dono){ guardarDono({id:data.id, token:data.token}); }
  }catch(e){}
}
function bloqueioDonoNoSlot(qid,data,h){
  return DB.bloqueios.find(b => b.quadra_id===qid && b.motivo===MOTIVO_DONO
    && bloqueiaDia(b,data) && b.inicio<=h && b.fim>h);
}
const ERROS_DONO = {sem_permissao:"Sua sessão de dono expirou — entre de novo",
  ja_reservado:"Esse horário já tem reserva de mensalista",
  data_passada:"Esse dia já passou", nao_encontrado:"Esse bloqueio não existe mais"};
async function donoFecharHorario(qid,h){
  if(!modoDonoAtivo()) return;
  const fim = String(+h.slice(0,2)+1).padStart(2,"0")+":00";
  if(DONO){ // dono entrou como mensalista: função segura no servidor
    const {data,error} = await sb.rpc("dono_fechar",{p_cliente_id:DONO.id,p_token:DONO.token,
      p_quadra_id:qid,p_data:PORTAL_DATA,p_inicio:h});
    if(error){ toast("Não deu para fechar","erro"); return; }
    if(!data?.ok){ toast(ERROS_DONO[data?.erro]||"Não deu para fechar","erro");
      if(data?.erro==="sem_permissao") guardarDono(null); renderPortalCliente(); return; }
  } else { // admin autenticado
    const {error} = await sb.from("agq_bloqueios").insert({id:uid(),quadra_id:qid,data:PORTAL_DATA,
      dia_semana:null,inicio:h,fim,permanente:false,motivo:MOTIVO_DONO});
    if(error){ toast("Não deu para fechar: "+error.message,"erro"); return; }
  }
  await carregar(); toast(`${h} fechado — ninguém mais reserva`); renderPortalCliente();
}
async function donoAbrirHorario(id,h){
  if(!modoDonoAtivo()) return;
  if(DONO){
    const {data,error} = await sb.rpc("dono_abrir",{p_cliente_id:DONO.id,p_token:DONO.token,p_bloqueio_id:id});
    if(error){ toast("Não deu para abrir","erro"); return; }
    if(!data?.ok){ toast(ERROS_DONO[data?.erro]||"Não deu para abrir","erro");
      if(data?.erro==="sem_permissao") guardarDono(null); renderPortalCliente(); return; }
  } else {
    const {error} = await sb.from("agq_bloqueios").delete().eq("id",id).eq("motivo",MOTIVO_DONO);
    if(error){ toast("Não deu para abrir: "+error.message,"erro"); return; }
  }
  await carregar(); toast(`${h} liberado para os mensalistas`); renderPortalCliente();
}

async function entrarModoDono(){
  const email=document.getElementById("mdEmail").value.trim();
  const senha=document.getElementById("mdSenha").value;
  if(!email||!senha){ toast("Preencha e-mail e senha","erro"); return; }
  const {data,error} = await sb.auth.signInWithPassword({email,password:senha});
  if(error){ toast(traduzErro(error.message),"erro"); return; }
  SESSAO=data.session; MODO_FECHAR=true;
  await carregar(); fecharModal(); toast("Modo dono ativo"); renderPortalCliente();
}
async function sairModoDono(){
  guardarDono(null); MODO_FECHAR=false;
  if(SESSAO){ await sb.auth.signOut(); SESSAO=null; await carregar(); }
  toast("Modo dono desligado"); renderPortalCliente();
}
function slotEstado(qid,data,h){
  if(horaForaDoExpediente(data,h)) return "fechado";
  if(ehPausa(h,data)) return "pausa";
  if(data===HOJE() && h<=String(new Date().getHours()).padStart(2,"0")+":00") return "passado";
  const bloq = DB.bloqueios.find(b=>b.quadra_id===qid&&bloqueiaDia(b,data)&&(!b.inicio||(b.inicio<=h&&b.fim>h)));
  if(bloq) return /aula/i.test(bloq.motivo||"") ? "aula" : "ocupado";
  const r = DB.reservas.find(x=>x.quadra_id===qid&&x.data===data&&x.status!=="cancelada"&&x.inicio<=h&&x.fim>h);
  if(!r) return "livre";
  return r.status==="aguardando" ? "pendente" : "ocupado";
}
function reservaAtivaNoDia(clienteId,data){
  return DB.reservas.find(r=>r.data===data && r.tipo==="avulsa" && ["aguardando","confirmada"].includes(r.status)
    && (r.cliente_id===clienteId || r.parceiro_id===clienteId));
}

function selecionarSlot(qid,h){
  const ja = SEL_SLOTS.some(s=>s.qid===qid&&s.h===h);
  SEL_SLOTS = ja ? [] : [{qid,h}]; // 1 hora por dia — seleção única

}

async function confirmarReservaCliente(){
  const s=SEL_SLOTS[0]; if(!s) return; // valida regras abaixo
  if(!podeReservarDia(PORTAL_DATA)){
    if(!dentroDaJanela(PORTAL_DATA)) toast(`Reservas abertas só até ${fmtData(dataLimiteReserva())}`,"erro");
    else toast(`Reservas para ${fmtData(PORTAL_DATA)} liberam às ${HORA_LIBERA_DIA_SEGUINTE}h de ${fmtData(diaAnterior(PORTAL_DATA))}`,"erro");
    fecharModal(); return;
  }
  if(horaForaDoExpediente(PORTAL_DATA,s.h)){ const f=faixaDoDia(PORTAL_DATA); toast(`Neste dia o clube funciona das ${String(f.abre).padStart(2,"0")}h às ${String(f.fecha).padStart(2,"0")}h`,"erro"); fecharModal(); renderPortalCliente(); return; }
  if(slotEstado(s.qid,PORTAL_DATA,s.h)!=="livre"){ toast("Este horário acabou de ser solicitado por outra pessoa","erro"); fecharModal(); renderPortalCliente(); return; }
  const tipoParc = document.querySelector('input[name="ptipo"]:checked').value;
  let parceiro_id=null, parceiro_nome="";
  if(tipoParc==="mensalista"){
    parceiro_id = document.getElementById("parcSel").value;
    if(!parceiro_id){ toast("Escolha o mensalista parceiro","erro"); return; }
    parceiro_nome = Svc.cliente(parceiro_id).nome;
  } else {
    parceiro_nome = document.getElementById("parcNome").value.trim();
    if(!parceiro_nome){ toast("Informe o nome do convidado","erro"); return; }
  }
  const minha = reservaAtivaNoDia(CLIENTE_LOGADO.id, PORTAL_DATA);
  if(minha){ toast(`Você já tem 1 hora neste dia (${hh(minha.inicio)} · ${esc(Svc.quadra(minha.quadra_id).nome)})`,"erro"); return; }
  if(parceiro_id){
    const doParc = reservaAtivaNoDia(parceiro_id, PORTAL_DATA);
    if(doParc){ toast(`${parceiro_nome.split(" ")[0]} já tem 1 hora neste dia — escolha outro parceiro ou outro dia`,"erro"); return; }
  }
  const q=Svc.quadra(s.qid);
  const fim=String(+s.h.slice(0,2)+1).padStart(2,"0")+":00";
  if(ONLINE && !SESSAO){
    // portal: cria a reserva por função segura no servidor (valida todas as regras)
    const {data:rr,error} = await sb.rpc("criar_reserva",{p_cliente_id:CLIENTE_LOGADO.id,p_quadra_id:s.qid,p_data:PORTAL_DATA,p_inicio:s.h,p_fim:fim,p_parceiro_id:parceiro_id,p_parceiro_nome:parceiro_nome,p_parceiro_tipo:tipoParc});
    if(error){ toast(error.message,"erro"); return; }
    if(rr && rr.ok===false){ toast(rr.erro||"Não foi possível reservar","erro"); return; }
    await carregar();
  } else {
    await up("reservas",{id:uid(),quadra_id:s.qid,cliente_id:CLIENTE_LOGADO.id,parceiro_id,parceiro_nome,parceiro_tipo:tipoParc,
      data:PORTAL_DATA,inicio:s.h,fim,tipo:"avulsa",valor:+q.preco||0,desconto:0,pagamento:false,forma:"",status:autoConfirma()?"confirmada":"aguardando",obs:"solicitado pelo portal"});
    registrarHist("solicitou reserva pelo portal",`${PORTAL_DATA} ${s.h} · com ${parceiro_nome}`);
  }
  SEL_SLOTS=[]; fecharModal();
  RESERVA_ENVIADA=true;
  renderPortalCliente();
  setTimeout(()=>{ RESERVA_ENVIADA=false; if(ROTA_ATUAL==="cliente") barraSelecao(); }, 5000);
}

    if(error || (rr && rr.ok===false)){ toast("Não foi possível cancelar essa reserva","erro"); return; }

function carregarFotoPerfil(inp){
  const f=inp.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){ toast("Selecione uma imagem","erro"); return; }
  const rd=new FileReader();
  rd.onload=e=>{ const img=new Image(); img.onload=()=>{
    const max=256, sc=Math.min(1,max/Math.max(img.width,img.height));
    const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    FOTO_TEMP=cv.toDataURL("image/jpeg",0.82);
    document.getElementById("prevFoto").innerHTML=`<img src="${FOTO_TEMP}" class="perfil-foto">`;
  }; img.src=e.target.result; };
  rd.readAsDataURL(f);
}

    CLIENTE_LOGADO = {...c, nome, email, ...(mudaFoto?{foto:FOTO_TEMP}:{})};

  }
  const obj={id:c.id,nome,telefone:document.getElementById("epTel").value,email};

  const r=await up("clientes",obj);

  fecharModal(); toast("Perfil atualizado! ✅"); renderPortalCliente();

  const email=document.getElementById("pcEmail").value.trim();
  const senha=document.getElementById("pcSenha").value, senha2=document.getElementById("pcSenha2").value;
  if(!nome||tel.replace(/\D/g,"").length<8){ toast("Preencha nome e telefone","erro"); return; }
  if(senha.length<4){ toast("A senha precisa ter pelo menos 4 caracteres","erro"); return; }
  if(senha!==senha2){ toast("As senhas não coincidem","erro"); return; }
  if(ONLINE && !SESSAO){
    // portal: cadastro por função segura no servidor
    const {data,error} = await sb.rpc("cadastrar_cliente",{p_nome:nome,p_tel:tel,p_email:email,p_senha:senha});
    if(error){ toast(error?.message||"Não foi possível criar a conta","erro"); return; }
    if(data?.erro==="ja_existe"){ toast("Esse telefone já tem conta — entre com telefone e senha.","erro"); modalEntrarCliente(continuar); return; }
    if(!data){ toast("Não foi possível criar a conta","erro"); return; }
    logarCliente(data); fecharModal();
    toast(`Bem-vindo, ${nome.split(" ")[0]}! 🎾`);
    if(continuar&&SEL_SLOTS.length) continuarReserva(); else renderPortalCliente();
    return;
  }
  const jaExiste=DB.clientes.find(x=>String(x.telefone||"").replace(/\D/g,"").endsWith(tel.replace(/\D/g,"").slice(-8)));
  if(jaExiste){
    logarCliente(jaExiste); fecharModal(); toast(`Você já tinha conta — bem-vindo de volta, ${jaExiste.nome.split(" ")[0]}!`);
    if(continuar&&SEL_SLOTS.length) continuarReserva(); else renderPortalCliente();
    return;
  }
  const obj={id:uid(),nome,telefone:tel,email,nivel:"Iniciante",creditos:0,mensalista:true};
  await up("clientes",obj);
  logarCliente(DB.clientes.find(c=>c.id===obj.id)||obj);
  registrarHist("cliente se cadastrou pelo portal",nome);
  fecharModal(); toast(`Bem-vindo, ${nome.split(" ")[0]}! 🎾`);
  if(continuar&&SEL_SLOTS.length) continuarReserva(); else renderPortalCliente();
}

/* ============================================================
   BUSCA GLOBAL
   ============================================================ */
function ligarBusca(){
  const inp=document.getElementById("buscaGlobal"), res=document.getElementById("buscaRes");
  inp.oninput=()=>{
    const b=inp.value.trim().toLowerCase();
    if(b.length<2){ res.style.display="none"; return; }
    const cli=DB.clientes.filter(c=>c.nome.toLowerCase().includes(b)||String(c.telefone||"").includes(b)).slice(0,5);
    const rsv=DB.reservas.filter(r=>Svc.cliente(r.cliente_id).nome.toLowerCase().includes(b)).slice(0,5);
    res.innerHTML =
      cli.map(c=>`<div class="item" onclick="fecharBusca();abrirDetalheCliente('${c.id}')">👤 <b>${esc(c.nome)}</b> <span class="muted">${esc(c.telefone||"")}</span></div>`).join("")+
      rsv.map(r=>`<div class="item" onclick="fecharBusca();abrirDetalheReserva('${r.id}')">🗒️ ${fmtData(r.data)} ${hh(r.inicio)} — ${esc(Svc.cliente(r.cliente_id).nome)}</div>`).join("")
      ||'<div class="item muted">Nada encontrado</div>';
    res.style.display="block";
  };
  document.addEventListener("click",e=>{ if(!e.target.closest(".top-busca")) res.style.display="none"; });
}
function fecharBusca(){ document.getElementById("buscaRes").style.display="none"; document.getElementById("buscaGlobal").value=""; }

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
(async function init(){
  montarNav(); ligarBusca();
  const lg=document.getElementById("logoAdm"); if(lg){ lg.innerHTML=LOGO_CREST; lg.style.cssText="width:38px;height:38px;display:inline-block;background:#AC4B14;border-radius:9px;overflow:hidden"; }
  if(ONLINE){
    const {data} = await sb.auth.getSession();
    SESSAO = data?.session||null;
    sb.auth.onAuthStateChange((_e,s)=>{ SESSAO=s; });
  }
  await carregar();          // já sabe se é admin (dados completos) ou portal (dados públicos)
  revincularCliente();       // restaura a conta salva neste aparelho
  aplicarTema();
  document.getElementById("nomeClube").textContent=DB.config.nome;
  document.getElementById("estadoConexao").textContent = ONLINE?"conectando…":"modo demo";
  if(ONLINE){ ligarRealtime(); }
  window.addEventListener("hashchange",rotear);
  if(!location.hash) location.hash="#/cliente";
  rotear();
})();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("/sw.js").catch(()=>{}); });
}
</script>
